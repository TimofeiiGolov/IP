name: iOS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Pishi.xcodeproj
  SCHEME: Pishi

jobs:
  build-and-test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Show environment versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Find available iPhone Simulator
        id: find_sim
        run: |
          # Пытаемся найти первый доступный iPhone-симулятор
          UDID=$(xcrun simctl list devices available | grep -m 1 -E "iPhone" | sed -E 's/.*\(([-0-9A-F]+)\).*/\1/')
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator found. Downloading iOS runtime..."
            xcodebuild -downloadPlatform iOS
            UDID=$(xcrun simctl list devices available | grep -m 1 -E "iPhone" | sed -E 's/.*\(([-0-9A-F]+)\).*/\1/')
          fi
          if [ -z "$UDID" ]; then
            echo "Still no iPhone simulator. Exiting."
            exit 1
          fi
          echo "UDID=$UDID" >> $GITHUB_OUTPUT
          echo "Selected simulator UDID: $UDID"

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Build
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.find_sim.outputs.UDID }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.find_sim.outputs.UDID }}" \
            -derivedDataPath DerivedData \
            -only-testing:PishiTests \
            -resultBundlePath UnitTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Run UI tests
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.find_sim.outputs.UDID }}" \
            -derivedDataPath DerivedData \
            -only-testing:PishiUITests \
            -resultBundlePath UITests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UnitTests.xcresult
          path: UnitTests.xcresult

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UITests.xcresult
          path: UITests.xcresult
