name: iOS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Pishi.xcodeproj
  SCHEME: Pishi

jobs:
  build-and-test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Show environment versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Download iOS Runtime (if missing)
        run: |
          # Проверяем наличие iOS 18.2, если нет - скачиваем
          if ! xcrun simctl list runtimes | grep -q "iOS 18.2"; then
            echo "iOS 18.2 runtime not found. Downloading..."
            xcodebuild -downloadPlatform iOS -buildVersion 18.2
          else
            echo "iOS 18.2 runtime is already installed."
          fi

      - name: Find available iPhone Simulator
        id: find_sim
        run: |
          # Ищем первый доступный iPhone, исключая placeholder-устройства
          UDID=$(xcrun simctl list devices available | grep -E "iPhone" | grep -v "Placeholder" | head -n 1 | sed -E 's/.*\(([-0-9A-F]+)\).*/\1/')
          if [ -z "$UDID" ]; then
            echo "No valid iPhone simulator found. Listing all devices:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "UDID=$UDID" >> $GITHUB_OUTPUT
          echo "Selected simulator UDID: $UDID"

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Build
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.find_sim.outputs.UDID }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.find_sim.outputs.UDID }}" \
            -derivedDataPath DerivedData \
            -only-testing:PishiTests \
            -resultBundlePath UnitTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Run UI tests
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.find_sim.outputs.UDID }}" \
            -derivedDataPath DerivedData \
            -only-testing:PishiUITests \
            -resultBundlePath UITests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UnitTests.xcresult
          path: UnitTests.xcresult

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UITests.xcresult
          path: UITests.xcresult
